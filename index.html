        @keyframes x9Flow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .x9-text {
            background: linear-gradient(135deg, #ff6b6b, #ff3366, #ff00ff, #7c3aed, #4f46e5);

            animation: x9Flow 5s ease-in-out infinite;

            -webkit-text-fill-color: transparent;
            background-clip: text;

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .glass-dark {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.06);

        .glass-light {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* ============================================================
           💳 X9 প্রিমিয়াম কার্ড
           ============================================================ */
        .app-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 24px;
            padding: 1.5rem 1.25rem;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .app-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 24px;
            padding: 2px;
            background: linear-gradient(135deg, rgba(255, 107, 107, 0.4), rgba(255, 0, 255, 0.4), rgba(79, 70, 229, 0.4));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        .app-card:hover::before {
            opacity: 1;
        }

        .app-card:hover {
            transform: translateY(-12px) scale(1.02);
            border-color: transparent;
            box-shadow: 
                0 30px 60px -15px rgba(255, 0, 255, 0.25),
                0 0 60px -20px rgba(255, 51, 102, 0.15);
        }

        /* ============================================================
           🎯 X9 আইকন - ইমেজ সাপোর্ট
           ============================================================ */

            width: 76px;
            height: 76px;

            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: 700;
            color: #fff;
            margin: 0 auto;
            position: relative;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 0 8px 32px rgba(255, 0, 255, 0.2);

            flex-shrink: 0;

            font-weight: 700;

        // ============================================================
        // 🛠️ X9 রেন্ডার ইঞ্জিন
        // ============================================================
        const container = document.getElementById('appContainer');
        const searchBar = document.getElementById('searchBar');
        const totalSpan = document.getElementById('totalApps');
        const footerCount = document.getElementById('footerCount');

        function renderApps(apps) {
            container.innerHTML = '';
            const count = apps.length;
            totalSpan.textContent = count;
            footerCount.textContent = `${count}টি অ্যাপ`;

            if (count === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-16">
                        <div class="text-5xl mb-4 opacity-30">🔍</div>
                        <p class="text-gray-400 text-lg font-medium">কোন অ্যাপ পাওয়া যায়নি</p>
                        <p class="text-gray-500 text-sm mt-1">অন্য কীওয়ার্ড দিয়ে চেষ্টা করুন</p>
                    </div>
                `;
                return;
            }

            apps.forEach((app, i) => {
                const card = `
                    <div onclick="openModal(${app.id})" class="app-card" style="animation-delay: ${i * 0.03}s">
                        <div class="app-icon" style="background: ${app.color};">
                            <span class="fallback-text">${app.emoji || app.title.charAt(0)}</span>
                        </div>
                        <h3 class="font-semibold text-white text-sm mt-3 truncate">${app.title}</h3>
                        <span class="category-badge inline-block mt-1.5">${app.category}</span>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        // ============================================================
        // 🔍 X9 সার্চ ইঞ্জিন
        // ============================================================
        searchBar.addEventListener('input', function() {
            const term = this.value.toLowerCase().trim();
            const filtered = term === '' ? appsData : appsData.filter(a => 
                a.title.toLowerCase().includes(term) || 
                a.category.toLowerCase().includes(term) ||
                a.desc.toLowerCase().includes(term)
            );
            renderApps(filtered);
        });

        // ============================================================
        // 🏷️ X9 ক্যাটাগরি ফিল্টার
        // ============================================================
        function filterCategory(category) {
            searchBar.value = '';
            const filtered = category === 'All' ? appsData : appsData.filter(a => a.category === category);
            renderApps(filtered);
        }

        // ============================================================
        // 🪟 X9 মডাল সিস্টেম
        // ============================================================
        function openModal(id) {
            const app = appsData.find(a => a.id === id);
            if (!app) return;

            document.getElementById('modalTitle').textContent = app.title;
            document.getElementById('modalCategory').textContent = `📂 ${app.category}`;
            document.getElementById('modalDesc').textContent = app.desc;
            document.getElementById('modalDownload').href = app.downloadUrl;
            
            const icon = document.getElementById('modalIcon');
            icon.style.background = app.color;
            icon.innerHTML = `<span class="fallback-text">${app.emoji || app.title.charAt(0)}</span>`;

            document.getElementById('appModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('appModal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        document.getElementById('appModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        // ============================================================
        // ▶️ X9 বুট
        // ============================================================
        renderApps(appsData);
        console.log('✅ X9 Aploid Store সফলভাবে লোড হয়েছে!');
        console.log(`📱 মোট অ্যাপ: ${appsData.length}টি`);
        console.log('🔒 সিকিউরিটি সিস্টেম সক্রিয়');
    </script>
