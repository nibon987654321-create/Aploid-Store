<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aploid Store - অ্যাপ ডাউনলোড স্টোর</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f3f4f6;
        }
        .app-card {
            transition: all 0.3s ease;
        }
        .app-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
        }
        .modal-backdrop {
            backdrop-filter: blur(4px);
        }
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .icon-gradient-1 { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .icon-gradient-2 { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .icon-gradient-3 { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
        .icon-gradient-4 { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
        .icon-gradient-5 { background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%); }
        .icon-gradient-6 { background: linear-gradient(135deg, #fccb90 0%, #d57eeb 100%); }
        .icon-gradient-7 { background: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%); }
        .icon-gradient-8 { background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); }
        
        .icon-text {
            font-size: 32px;
            font-weight: bold;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-animation {
            animation: fadeIn 0.3s ease-out;
        }
        
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>

            <button onclick="filterCategory('Games')" class="bg-white text-gray-700 px-6 py-2.5 rounded-full font-medium shadow hover:shadow-lg hover:bg-gray-50 transition-all shrink-0">🎮 গেমস</button>

    </div>

        // =====================================================
        const appContainer = document.getElementById('appContainer');
        const searchBar = document.getElementById('searchBar');
        const totalAppsSpan = document.getElementById('totalApps');

        function getInitials(title) {
            return title.charAt(0).toUpperCase();
        }

        function displayApps(apps) {
            appContainer.innerHTML = "";
            totalAppsSpan.textContent = apps.length;
            
            if(apps.length === 0) {
                appContainer.innerHTML = `
                    <div class="col-span-full text-center py-12">
                        <div class="text-6xl mb-4">🔍</div>
                        <h3 class="text-xl font-semibold text-gray-600">কোনো অ্যাপ পাওয়া যায়নি!</h3>
                        <p class="text-gray-400 mt-2">অন্য কোনো নাম দিয়ে খুঁজুন</p>
                    </div>
                `;
                return;
            }
            
            apps.forEach(app => {
                const initial = getInitials(app.title);
                const appCard = `
                    <div onclick="openModal(${app.id})" class="app-card bg-white p-4 rounded-2xl shadow-md hover:shadow-xl cursor-pointer flex flex-col items-center text-center">
                        <div class="w-20 h-20 rounded-2xl flex items-center justify-center shadow-md ${app.gradient}">
                            <span class="icon-text">${initial}</span>
                        </div>
                        <h2 class="font-bold text-gray-800 text-sm md:text-base mt-3 line-clamp-1 w-full">${app.title}</h2>
                        <span class="text-xs text-gray-400 mt-1 bg-gray-100 px-3 py-1 rounded-full">${app.category}</span>
                    </div>
                `;
                appContainer.innerHTML += appCard;
            });
        }

        searchBar.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase().trim();
            if(searchTerm === '') {
                displayApps(appsData);
            } else {
                const filteredApps = appsData.filter(app => 
                    app.title.toLowerCase().includes(searchTerm) ||
                    app.category.toLowerCase().includes(searchTerm)
                );
                displayApps(filteredApps);
            }
        });

        function filterCategory(category) {
            if(category === 'All') {
                displayApps(appsData);
                searchBar.value = '';
            } else {
                const filteredApps = appsData.filter(app => app.category === category);
                displayApps(filteredApps);
                searchBar.value = '';
            }
        }

        function openModal(id) {
            const app = appsData.find(a => a.id === id);
            if(!app) return;

            document.getElementById('modalTitle').innerText = app.title;
            document.getElementById('modalCategory').innerText = `📂 ${app.category}`;
            document.getElementById('modalDesc').innerText = app.desc;
            document.getElementById('modalDownload').href = app.downloadUrl;
            
            const iconContainer = document.getElementById('modalIconContainer');
            iconContainer.className = `w-24 h-24 rounded-2xl shadow-xl flex items-center justify-center border-4 border-white ${app.gradient}`;
            document.getElementById('modalIconText').innerText = getInitials(app.title);

            document.getElementById('appModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('appModal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        document.getElementById('appModal').addEventListener('click', function(e) {
            if(e.target === this) closeModal();
        });

        document.addEventListener('keydown', function(e) {
            if(e.key === 'Escape') closeModal();
        });

        displayApps(appsData);
    </script>

</body>
</html>
